<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>High Noon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* Layout: one full-screen stage, a 16:9 pixel canvas letterboxed inside it. */
  :root { --bg: #1b1410; --fg: #f4efe0; --gold: #ffd23f; color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { box-sizing: border-box; display: flex; overflow: hidden; background: var(--bg); color: var(--fg);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #stage { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100%; aspect-ratio: 1280/540; cursor: none; touch-action: none; image-rendering: pixelated; }
  #rotate { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    background: var(--bg); color: var(--fg); font: 14px/1.8 "Press Start 2P", monospace; text-align: center; padding: 24px; }
  #rotate b { color: var(--gold); font-weight: normal; font-size: 18px; }
  #rotate .ph { width: 44px; height: 76px; border: 4px solid var(--fg); border-radius: 8px; animation: turn 2.4s ease-in-out infinite; }
  @keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display: flex; } }
  @media (prefers-reduced-motion: reduce) { #rotate .ph { animation: none; transform: rotate(-90deg); } }
</style>
<div id="stage"><canvas id="game" width="1280" height="540"></canvas></div>
<div id="rotate"><div class="ph"></div><b>HIGH NOON</b><div>TURN YOUR PHONE SIDEWAYS TO PLAY</div></div>
<script src="engine.js"></script>
<script src="chapter1.js"></script>
<script src="chapter2.js"></script>
<script src="chapter3.js"></script>
<script>requestAnimationFrame(loop); // start the game once every file has loaded</script>
</body></html>
